backend:
  name: git-gateway
  branch: main

media_folder: static/images
public_folder: static/images

locale: th

collections:
  - name: "news"
    label: "📰 ข่าวสาร"
    files:
      - name: "news-list"
        label: "รายการข่าวทั้งหมด"
        file: "static/data/news.json"
        fields:
          - label: "รายการข่าว"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - label: "รหัสข่าว (ห้ามซ้ำ)"
                name: "id"
                widget: "number"
                value_type: "int"
              - label: "หัวข้อข่าว"
                name: "title"
                widget: "string"
              - label: "รายละเอียดสั้น (แสดงบนการ์ด)"
                name: "description"
                widget: "text"
              - label: "เนื้อหาเต็ม (แสดงใน popup)"
                name: "content"
                widget: "markdown"
              - label: "รูปภาพประกอบ"
                name: "image"
                widget: "image"
                required: false
                allow_multiple: false

  - name: "events"
    label: "📅 ปฏิทินกิจกรรม"
    files:
      - name: "events-data"
        label: "กิจกรรมทั้งหมด"
        file: "static/data/events.json"
        fields:
          - label: "ปี พ.ศ. (วันสำคัญ)"
            name: "holidaysYear"
            widget: "string"
          - label: "กิจกรรมประจำ"
            name: "regular"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - {label: "บรรทัดที่ 1 (เช่น ทุก)", name: "day1", widget: "string"}
              - {label: "บรรทัดที่ 2 (เช่น อาทิตย์)", name: "day2", widget: "string"}
              - {label: "ชื่อกิจกรรม", name: "title", widget: "string"}
              - {label: "เวลา", name: "time", widget: "string"}
              - {label: "สถานที่", name: "location", widget: "string"}
              - {label: "สีแถบ (CSS class)", name: "color", widget: "string", default: "bg-emerald-100 text-primary"}
          - label: "วันสำคัญทางพระพุทธศาสนา"
            name: "holidays"
            widget: "list"
            summary: "{{fields.date}} — {{fields.title}}"
            fields:
              - {label: "วันที่ (เช่น 3 มี.ค.)", name: "date", widget: "string"}
              - {label: "ชื่อย่อ (เช่น มาฆบูชา)", name: "name", widget: "string"}
              - {label: "ชื่อเต็ม", name: "title", widget: "string"}
              - {label: "รายละเอียด", name: "detail", widget: "string"}
              - {label: "สีแถบ (CSS class)", name: "color", widget: "string", default: "bg-gold/10 text-yellow-800"}
          - label: "กิจกรรมที่กำลังจะมาถึง"
            name: "upcoming"
            widget: "list"
            summary: "{{fields.month}} {{fields.date}} — {{fields.title}}"
            fields:
              - {label: "เดือน (เช่น ม.ค.)", name: "month", widget: "string"}
              - {label: "วันที่ (เช่น 24-26)", name: "date", widget: "string"}
              - {label: "ป้ายกำกับ (badge)", name: "badge", widget: "string"}
              - {label: "ชื่อกิจกรรม", name: "title", widget: "string"}
              - {label: "รายละเอียด", name: "detail", widget: "string"}
              - {label: "badgeClass", name: "badgeClass", widget: "string", default: "badge-primary"}
              - {label: "borderColor", name: "borderColor", widget: "string", default: "border-primary"}
              - {label: "dateClass", name: "dateClass", widget: "string", default: "bg-primary text-white"}
              - label: "วันสิ้นสุด (ซ่อนอัตโนมัติหลังวันนี้)"
                name: "endDate"
                widget: "datetime"
                format: "YYYY-MM-DD"
                date_format: "DD/MM/YYYY"
                time_format: false
                required: false

  - name: "gallery"
    label: "🖼️ แกลเลอรีภาพ"
    files:
      - name: "gallery-list"
        label: "รูปภาพทั้งหมด"
        file: "static/data/gallery.json"
        fields:
          - label: "รูปภาพ"
            name: "items"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - label: "รูปภาพ"
                name: "src"
                widget: "image"
                allow_multiple: false
              - label: "คำอธิบายรูป"
                name: "alt"
                widget: "string"
              - label: "รูปกว้างพิเศษ (ใช้ได้แค่รูปแรก)"
                name: "wide"
                widget: "boolean"
                default: false
                required: false

  - name: "monks"
    label: "🧘 พระสงฆ์"
    files:
      - name: "abbots"
        label: "ทำเนียบเจ้าอาวาส"
        file: "static/data/abbots.json"
        fields:
          - label: "รายชื่อเจ้าอาวาส"
            name: "items"
            widget: "list"
            summary: "{{fields.sequence}} — {{fields.name}}"
            fields:
              - {label: "ลำดับที่ (เช่น ลำดับที่ 7)", name: "sequence", widget: "string"}
              - {label: "ชื่อ", name: "name", widget: "string"}
              - {label: "ปีที่ดำรงตำแหน่ง", name: "years", widget: "string"}
              - label: "รูปภาพ"
                name: "image"
                widget: "image"
                required: false
                allow_multiple: false
              - label: "เจ้าอาวาสปัจจุบัน (กรอบทอง)"
                name: "isCurrent"
                widget: "boolean"
                default: false
                required: false

      - name: "officials"
        label: "พระสังฆาธิการ"
        file: "static/data/officials.json"
        fields:
          - label: "รายชื่อพระสังฆาธิการ"
            name: "items"
            widget: "list"
            summary: "{{fields.position}} — {{fields.name}}"
            fields:
              - {label: "ชื่อ (ใช้ <br> สำหรับขึ้นบรรทัดใหม่)", name: "name", widget: "string"}
              - {label: "ตำแหน่ง", name: "position", widget: "string"}
              - label: "รูปภาพ"
                name: "image"
                widget: "image"
                allow_multiple: false
              - label: "สีป้าย"
                name: "badgeClass"
                widget: "select"
                options:
                  - {label: "เขียว (เจ้าอาวาส)", value: "badge-primary"}
                  - {label: "ทอง (ผู้ช่วย)", value: "badge-outline badge-warning"}
              - {label: "กรอบสี (เช่น border-primary)", name: "frameBorder", widget: "string", required: false, default: ""}

  - name: "settings"
    label: "⚙️ ตั้งค่าเว็บ"
    files:
      - name: "contact"
        label: "ข้อมูลติดต่อ"
        file: "static/data/contact.json"
        fields:
          - label: "เบอร์โทรศัพท์"
            name: "phone"
            widget: "string"
          - label: "LINE ID"
            name: "lineId"
            widget: "string"
          - label: "LINE URL"
            name: "lineUrl"
            widget: "string"
          - label: "Facebook URL"
            name: "facebook"
            widget: "string"
          - label: "ชื่อ Facebook Page"
            name: "facebookName"
            widget: "string"
          - label: "อีเมล"
            name: "email"
            widget: "string"

      - name: "donation"
        label: "ทำบุญออนไลน์"
        file: "static/data/donation.json"
        fields:
          - {label: "ชื่อธนาคาร", name: "bank", widget: "string"}
          - {label: "ชื่อบัญชี", name: "accountName", widget: "string"}
          - {label: "เลขที่บัญชี", name: "accountNumber", widget: "string"}
          - label: "QR Code บริจาค"
            name: "qrImage"
            widget: "image"
            allow_multiple: false
          - {label: "LINE URL", name: "lineUrl", widget: "string"}
          - {label: "LINE ID", name: "lineId", widget: "string"}

      - name: "site-settings"
        label: "ตั้งค่าทั่วไป"
        file: "static/data/site-settings.json"
        fields:
          - label: "Google Calendar URL"
            name: "calendarEmbedUrl"
            widget: "string"
            hint: "วิธีได้ URL: Google Calendar → Settings → ชื่อปฏิทิน → Integrate calendar → คัดลอก Public URL"
            required: false
